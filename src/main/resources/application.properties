spring.application.name=collabflow

# Database. Each value can be overridden with an environment variable (e.g. DB_PASSWORD).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:collabflow}
spring.datasource.username=${DB_USERNAME:collabflow}
spring.datasource.password=${DB_PASSWORD:collabflow}

# Flyway creates and changes tables (src/main/resources/db/migration).
# Hibernate only checks that the entities match those tables.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a database session open while the JSON response is written.
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Login tokens. The secret (collabflow.jwt.secret) is required but deliberately not set here:
# put it in config/application.properties (git-ignored) or the COLLABFLOW_JWT_SECRET variable.
collabflow.jwt.expiry=24h
